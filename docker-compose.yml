services:
  db:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent || exit 1",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - wp-net

  ols:
    image: litespeedtech/openlitespeed:1.8.2-lsphp83
    container_name: ${COMPOSE_PROJECT_NAME}-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT}:80"
      - "${OLS_ADMIN_PORT}:7080"
    environment:
      ADMIN_PASSWORD: ${OLS_ADMIN_PASSWORD}
    volumes:
      - ./wordpress:/var/www/vhosts/localhost/html
    networks:
      - wp-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ${COMPOSE_PROJECT_NAME}-pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    networks:
      - wp-net

  wp-auto-install:
    image: wordpress:cli
    container_name: ${COMPOSE_PROJECT_NAME}-auto-install
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      ols:
        condition: service_started
    volumes:
      - ./wordpress:/var/www/html
      - ./scripts/wp-auto-install.sh:/usr/local/bin/wp-auto-install.sh:ro
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WP_URL: ${WP_URL}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_LOCALE: ${WP_LOCALE:-en_US}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/wp-auto-install.sh
    networks:
      - wp-net

volumes:
  db_data:

networks:
  wp-net:
